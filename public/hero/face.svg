<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <!--
    Rosto de exemplo para o hero pontilhado.
    Regra: quanto mais claro, mais pontos (e mais à frente). Preto = vazio.
    Substitua por um vetor/foto do seu rosto com o mesmo nome; imagens
    escuras sobre fundo claro são invertidas automaticamente.
  -->
  <defs>
    <radialGradient id="skin" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#8a8a8a"/>
      <stop offset=".6" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2c2c2c"/>
    </radialGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3c3c3c"/>
      <stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
    <linearGradient id="shoulders" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#1e1e1e"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="1" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="#000"/>

  <!-- ombros e pescoço -->
  <path d="M28 500 C44 446 112 424 162 420 L238 420 C288 424 356 446 372 500 Z" fill="url(#shoulders)"/>
  <path d="M164 356 C162 384 160 404 156 426 C184 440 216 440 244 426 C240 404 238 384 236 356 Z" fill="url(#neck)"/>

  <!-- orelhas -->
  <ellipse cx="98" cy="244" rx="15" ry="31" fill="#4e4e4e" stroke="#d0d0d0" stroke-width="3"/>
  <ellipse cx="302" cy="244" rx="15" ry="31" fill="#4e4e4e" stroke="#d0d0d0" stroke-width="3"/>

  <!-- rosto -->
  <path d="M200 92 C258 92 300 130 302 200 C304 262 292 316 262 350 C240 375 222 390 200 390 C178 390 160 375 138 350 C108 316 96 262 98 200 C100 130 142 92 200 92 Z"
        fill="url(#skin)" stroke="#ffffff" stroke-width="5"/>

  <!-- cabelo -->
  <path d="M94 214 C80 124 128 56 204 52 C282 48 330 112 310 210 C302 168 280 132 244 118 C206 104 160 110 132 140 C112 162 100 186 94 214 Z"
        fill="url(#hair)"/>
  <path d="M120 150 C150 110 210 96 262 116 M140 128 C180 100 236 96 282 128 M112 178 C128 140 168 120 214 116"
        stroke="#cfcfcf" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- órbitas (escuras = menos pontos, dá profundidade) -->
  <ellipse cx="160" cy="228" rx="33" ry="19" fill="#262626"/>
  <ellipse cx="240" cy="228" rx="33" ry="19" fill="#262626"/>

  <!-- sobrancelhas -->
  <path d="M132 204 Q158 190 186 199" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M214 199 Q242 190 268 204" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- olhos -->
  <path d="M138 229 Q160 214 182 229 Q160 239 138 229 Z" fill="#3a3a3a" stroke="#ffffff" stroke-width="5"/>
  <path d="M218 229 Q240 214 262 229 Q240 239 218 229 Z" fill="#3a3a3a" stroke="#ffffff" stroke-width="5"/>
  <circle cx="160" cy="228" r="8" fill="#ffffff"/>
  <circle cx="240" cy="228" r="8" fill="#ffffff"/>
  <circle cx="160" cy="228" r="2.5" fill="#000"/>
  <circle cx="240" cy="228" r="2.5" fill="#000"/>

  <!-- nariz -->
  <path d="M200 226 C198 252 196 272 192 288" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M182 294 Q200 308 218 294" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="189" cy="296" rx="5" ry="3" fill="#2a2a2a"/>
  <ellipse cx="211" cy="296" rx="5" ry="3" fill="#2a2a2a"/>

  <!-- boca -->
  <path d="M166 333 Q183 321 200 327 Q217 321 234 333 Q200 339 166 333 Z" fill="#ffffff"/>
  <path d="M168 335 Q200 357 232 335 Q200 343 168 335 Z" fill="#e8e8e8"/>
  <path d="M166 334 Q200 341 234 334" stroke="#2a2a2a" stroke-width="2" fill="none"/>

  <!-- maçãs do rosto (brilho) -->
  <ellipse cx="140" cy="284" rx="22" ry="14" fill="#8a8a8a" opacity=".5"/>
  <ellipse cx="260" cy="284" rx="22" ry="14" fill="#8a8a8a" opacity=".5"/>
</svg>
